[package]
name = "mdr"
version = "0.1.0"
edition = "2021"
description = "一个现代化的终端 Markdown 渲染器，内置 pager 和 HTTP 服务器"
authors = ["titor"]
license = "MIT"
repository = "https://github.com/titor/mdr"

[[bin]]
name = "mdr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
comrak = "0.33"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
syntect = { version = "5", default-features = false, features = ["default-onig"] }
anyhow = "1"
walkdir = "2"
unicode-width = "0.2"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
minijinja = "2.21.0"
tower-http = { version = "0.7.0", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
