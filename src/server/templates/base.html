<!DOCTYPE html>
<html lang="zh-CN"{% if theme == "dark" %} class="dark"{% endif %}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MDR{% endblock %} — MDR</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="logo">MDR</a>
      <span class="subtitle">Markdown 文档浏览器</span>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="footer-inner">
      <span>© 2026 mdr — Markdown Renderer</span>
      <button id="theme-toggle" onclick="toggleTheme()">🌙 暗色</button>
    </div>
  </footer>

  <script src="/assets/script.js"></script>
</body>
</html>
