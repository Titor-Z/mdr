{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="doc-layout">
  <nav class="sidebar">
    <ul>
    {% for doc in all_docs %}
      <li>
        <a href="/docs/{{ doc.path }}"
           class="{% if doc.path == current_path %}active{% endif %}">
          {{ doc.path }}
        </a>
      </li>
    {% endfor %}
    </ul>
  </nav>

  <div class="content-wrapper">
    <!-- 窄屏页面导航 -->
    {% if toc | length > 0 %}
    <div class="page-nav">
      <button class="page-nav-btn" onclick="togglePageNav()">
        页面导航
        <span class="page-nav-chevron" id="page-nav-chevron">▾</span>
      </button>
      <div class="page-nav-dropdown" id="page-nav-dropdown">
        <ul class="page-nav-list">
        {% for item in toc %}
          <li class="nav-level-{{ item.level }}">
            <a href="#{{ item.slug }}" onclick="closePageNav()">{{ item.text }}</a>
          </li>
        {% endfor %}
        </ul>
      </div>
    </div>
    {% endif %}

    <article class="content">
      {{ content | safe }}
    </article>
  </div>
</div>
{% endblock %}
